name: Aggiorna prezzi
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prezzi
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python raccogli_prezzi.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add prezzi.json storico.json
          git commit -m "aggiornamento prezzi" || exit 0
          git push
